[project]
name = "world-heritage-explorer"
version = "0.1.0"
description = "世界遺産の分布・登録動向を可視化するStreamlitアプリ"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.62,<2",
    "streamlit-folium>=0.27,<1",
    "folium>=0.20,<1",
    "plotly>=7.0,<8",
    "pandas>=3.0,<4",
    "geopandas>=1.1,<2",
    "requests>=2.34,<3",
    "tenacity>=9.1,<10",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<1",
    "pytest>=9.1,<10",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# Streamlit エントリー/ページはインポート前に sys.path を調整するため E402 を許容する
"app/main.py" = ["E402"]
"app/pages/*" = ["E402"]
